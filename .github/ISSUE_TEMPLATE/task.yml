name: Task Issue
description: Feature を構成する実装 Task
title: "[Task] "
labels:
  - type: task

body:
  - type: markdown
    attributes:
      value: |
        ## 概要

        Task Issue は、
        Feature Issue を実現するための実装単位を定義する。

        Task は、
        AI が単独で実装・確認可能な粒度に分割すること。

        また、
        Feature Issue の目的から逸脱しないこと。

  - type: input
    id: related-feature
    attributes:
      label: Related Feature
      description: 関連する Feature Issue を記載する
      placeholder: "#10"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: この Task の目的を書く
      placeholder: |
        terminal buffer を生成できるようにする
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 今回実装する内容を書く
      placeholder: |
        - terminal buffer 作成
        - buffer 設定
        - window 表示
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: 今回やらないことを書く
      placeholder: |
        - Codex process 起動
        - session resume
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: 完了条件を書く
      placeholder: |
        - [ ] terminal buffer を生成できる
        - [ ] Neovim 上で表示できる
        - [ ] 既存 buffer に影響しない
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation Notes
      description: 実装上の注意点を書く
      placeholder: |
        - terminal.nvim を利用しない
        - vim.fn.termopen を利用する
        - 過剰 abstraction を避ける

  - type: textarea
    id: test-story
    attributes:
      label: Test Story
      description: 動作確認方法を書く
      placeholder: |
        ## Setup

        - Neovim を起動する

        ## Steps

        1. :OrbitStart を実行する
        2. terminal buffer が開くことを確認する

        ## Expected Result

        - terminal buffer が表示される
        - Neovim がエラーにならない
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 補足事項があれば記載する
      placeholder: |
        - 
        -
