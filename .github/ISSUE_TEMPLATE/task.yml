name: Task Issue
description: Feature を構成する実装 Task
title: "[Task] "
labels:
  - type: task

body:
  - type: markdown
    attributes:
      value: |
        ## 概要

        Task Issue は Feature を実現するための実装単位を定義する。

        AI が単独で実装・確認できる粒度まで具体化すること。

        曖昧な表現（整理する、対応する、改善する）は避けること。

  - type: input
    id: related-feature
    attributes:
      label: Related Feature
      placeholder: "#28"
    validations:
      required: true

  - type: textarea
    id: depends-on
    attributes:
      label: Depends On
      placeholder: |
        - #29
        - #30
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      placeholder: |
        config.get() を利用できるようにする
    validations:
      required: true

  - type: textarea
    id: implementation-target
    attributes:
      label: Implementation Target
      description: 変更対象の file / module を明記する
      placeholder: |
        lua/orbit/config/init.lua
        lua/orbit/config/defaults.lua
    validations:
      required: true

  - type: textarea
    id: api-definition
    attributes:
      label: API Definition
      description: 作成・変更する API を具体的に定義する
      placeholder: |
        function M.get()
          return vim.deepcopy(current)
        end
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: 実装後の期待動作を書く
      placeholder: |
        - config.get() が利用できる
        - deep copy を返す
        - default table を汚染しない
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      placeholder: |
        - config.get() を実装する
        - module export を追加する
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      placeholder: |
        - setup(opts)
        - validation
        - terminal workflow への反映
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] config.get() が利用できる
        - [ ] deep copy を返す
        - [ ] default table を汚染しない
    validations:
      required: true

  - type: textarea
    id: implementation-policy
    attributes:
      label: Implementation Policy
      placeholder: |
        ## 許可すること
        - 最小実装

        ## 禁止すること
        - 後続 Task の先取り
        - 大規模リファクタ
        - 未定義 API の追加
    validations:
      required: true

  - type: textarea
    id: test-story
    attributes:
      label: Test Story
      placeholder: |
        ## Setup
        - Neovim を起動する

        ## Steps
        1. :lua print(require("orbit.config").get())

        ## Expected Result
        - error が発生しない
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation Notes
      placeholder: |
        - #34 の実装を置き換える
        - defaults table を直接返さない

  - type: textarea
    id: handoff
    attributes:
      label: Handoff
      placeholder: |
        - 実処理は #33 で実装する
        - validation は別 Issue で扱う

  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: |
        - 補足事項