name: Feature Issue
description: ユーザー価値を提供する Feature Issue
title: "[Feature] "
labels:
  - type: feature

body:
  - type: markdown
    attributes:
      value: |
        ## 概要

        Feature Issue はユーザー価値を提供する機能を定義する。

        Task の集合ではなく、Feature 完了後に利用者が何をできるようになるかを明確にすること。

  - type: textarea
    id: user-story
    attributes:
      label: User Story
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: この Feature が成立させることを簡潔に記載する
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true

  - type: textarea
    id: implementation-target
    attributes:
      label: Implementation Target
      description: 対象となる module / directory / subsystem を記載する
      placeholder: |
        lua/orbit/config/
        lua/orbit/init.lua
        tests/
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: Feature 完了後の期待動作を書く
    validations:
      required: true

  - type: textarea
    id: feature-boundary
    attributes:
      label: Feature Boundary
      description: この Feature が責任を持つ範囲を明確にする
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
    validations:
      required: true

  - type: textarea
    id: task-breakdown
    attributes:
      label: Task Breakdown
      description: Feature を構成する Task を列挙する
      placeholder: |
        - [ ] schema
        - [ ] defaults
        - [ ] runtime config
    validations:
      required: true

  - type: textarea
    id: implementation-policy
    attributes:
      label: Implementation Policy
      placeholder: |
        - 後続 Feature を先取りしない
        - 大規模リファクタを行わない
        - 既存 workflow を壊さない
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
    validations:
      required: true

  - type: textarea
    id: test-story
    attributes:
      label: Test Story
    validations:
      required: true

  - type: textarea
    id: handoff
    attributes:
      label: Handoff
      description: 後続 Feature や Milestone に引き継ぐ内容を書く

  - type: textarea
    id: notes
    attributes:
      label: Notes